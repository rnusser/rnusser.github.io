<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar 2026 - Google Auth</title>
    <style>
        :root {
            --bg-primary: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
            --selection-bg: rgba(255, 255, 255, 0.3);
            --font-mono: 'DejaVu Sans Mono', 'Courier New', Courier, monospace;
            --accent: #bd93f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-mono);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            overflow-x: auto;
        }

        header { margin-bottom: 30px; text-align: center; width: 100%; max-width: 1200px; }
        h1 { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; }

        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

        button.tool-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.tool-btn:hover { background: #333; border-color: #666; }
        button.tool-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        
        #btn-login { border-color: var(--accent); color: var(--accent); }
        #user-info { font-size: 0.7rem; color: var(--accent); margin-top: 5px; }

        .instructions { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; }
        kbd { background: #333; padding: 2px 4px; border-radius: 3px; color: #fff; }

        #calendar-container {
            display: grid;
            grid-template-columns: repeat(3, 400px); 
            gap: 40px 20px;
            justify-content: center;
            width: fit-content;
        }

        .month-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            min-height: 220px;
            width: 400px;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 32px);
            grid-auto-rows: 24px;
            user-select: none;
            flex-shrink: 0;
        }

        .month-name {
            grid-column: span 7;
            text-align: center;
            font-weight: bold;
            height: 30px;
            line-height: 30px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 5px;
        }

        .weekday-header { color: var(--text-muted); font-size: 0.75rem; text-align: center; line-height: 24px; }

        .day {
            position: relative;
            text-align: center;
            line-height: 24px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .day:hover { border-color: #555; }
        .day.selected { background-color: var(--selection-bg); }
        .day.empty { cursor: default; }

        .stripe-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column-reverse; 
            pointer-events: none; padding-bottom: 2px;
        }

        .event-stripe { width: 100%; height: 1px; margin-top: 1px; }

        .legend-panel {
            flex: 1; font-size: 0.65rem; border-left: 1px solid var(--border-color);
            padding-left: 8px; display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; max-height: 180px; margin-top: 35px; max-width: 150px;
        }

        .legend-item { display: flex; align-items: flex-start; gap: 5px; color: var(--text-main); margin-bottom: 2px; }
        .legend-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .initials-tag { color: var(--text-muted); font-weight: bold; margin-right: 2px; }
        .color-dot { width: 10px; height: 2px; display: inline-block; flex-shrink: 0; margin-top: 6px; }

        #event-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #222; border: 1px solid #444;
            padding: 20px; z-index: 1000; box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 320px;
        }

        #event-modal h3 { margin-bottom: 15px; font-size: 0.9rem; color: #ddd; }
        .modal-field { margin-bottom: 15px; }
        .modal-field label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }

        #event-modal input[type="text"] {
            width: 100%; background: #000; border: 1px solid #444;
            color: #fff; padding: 8px; font-family: var(--font-mono);
        }

        .color-picker { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .color-opt { width: 20px; height: 20px; cursor: pointer; border: 2px solid transparent; }
        .color-opt.active { border-color: #fff; }

        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btns button { padding: 5px 12px; cursor: pointer; background: #333; border: 1px solid #555; color: white; font-family: var(--font-mono); }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; }
        #loading-indicator { position: fixed; bottom: 20px; right: 20px; font-size: 0.7rem; color: var(--text-muted); }
        .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 8px 16px; font-size: 0.8rem; border-radius: 4px; display: none; z-index: 2000; }
        
        /* Version Tag Style */
        .version-tag {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.6rem;
            color: var(--text-muted);
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Sidebar Styles */
        #sidebar-recent {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 180px;
            background: #111;
            border-left: 1px solid var(--border-color);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: bold;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .recent-item {
            font-size: 0.75rem;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recent-item:hover {
            background: #222;
            border-color: var(--accent);
            color: #fff;
        }

        .recent-item.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #151515;
        }

        /* Adjust main body padding for sidebar */
        body {
            padding-right: 200px;
        }

        @media (max-width: 1400px) {
            #sidebar-recent { width: 140px; }
            body { padding-right: 160px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CALENDAR 2026</h1>
        <div id="user-info">Checking status...</div>
        <div class="controls">
            <button id="btn-login" class="tool-btn">SIGN IN WITH GOOGLE</button>
            <button id="btn-share" class="tool-btn">SHARE LINK</button>
            <button id="btn-filter-me" class="tool-btn">MY ENTRIES ONLY</button>
        </div>
        <p class="instructions">Drag to select. Release <kbd>Shift</kbd> or Mouse to save.</p>
    </header>

    <div id="calendar-container"></div>
    <div id="loading-indicator">Initializing...</div>
    <div id="toast" class="toast">Link copied!</div>
    <div class="version-tag">v1.1.12</div>

    <aside id="sidebar-recent">
        <div class="sidebar-title">RECENT CALENDARS</div>
        <div id="recent-list"></div>
    </aside>

    <div id="overlay"></div>
    <div id="event-modal">
        <h3>New Entry</h3>
        <div class="modal-field">
            <label>Description</label>
            <input type="text" id="event-note" placeholder="Meeting, Holiday, etc." autocomplete="off">
        </div>
        <div class="modal-field">
            <label>Category Color</label>
            <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="modal-btns">
            <button id="btn-cancel">Cancel</button>
            <button id="btn-save">Save</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { initializeFirestore, collection, addDoc, onSnapshot, query, doc, getDocs, getDocsFromServer, CACHE_SIZE_UNLIMITED } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Error Handler
        window.onerror = function(msg, url, line, col, error) {
            console.error("GLOBAL ERROR:", msg, "at", url, ":", line);
            if (msg.includes("400")) {
                console.error("DETECTED SERVER 400 ERROR - This usually means the Firestore API is disabled or the configuration is incorrect.");
            }
            return false;
        };

        function getInitials(name) {
            if (!name) return "??";
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const userFirebaseConfig = {
            apiKey: "AIzaSyDiK4IE76BtbynIxtfd2jdmDG73an66znc",
            authDomain: "nusscalendar-a4862.firebaseapp.com",
            projectId: "nusscalendar-a4862",
            storageBucket: "nusscalendar-a4862.firebasestorage.app",
            messagingSenderId: "1062471022470",
            appId: "1:1062471022470:web:279d68596c64790ba09e07"
        };
        // ----------------------------------------

        let firebaseConfig = userFirebaseConfig;
        let currentCid = 'default-cid';

        const urlParams = new URLSearchParams(window.location.search);
        let calendarIdFromUrl = urlParams.get('cid');

        if (!calendarIdFromUrl) {
            calendarIdFromUrl = Math.random().toString(36).substring(2, 8).toUpperCase();
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?cid=' + calendarIdFromUrl;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }
        
        currentCid = calendarIdFromUrl;
        console.log("INITIALIZATION - CID:", currentCid, "Project:", firebaseConfig.projectId);

        let db = null, auth = null;
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            
            // Use initializeFirestore to force long-polling (fixes many 400 Bad Request network issues)
            db = initializeFirestore(app, {
                experimentalForceLongPolling: true,
                useFetchStreams: false
            });
            
            console.log("Firebase/Firestore Initialized (Long-Polling Mode)");
        } catch (e) {
            console.error("FIREBASE INIT ERROR:", e);
        }

        const container = document.getElementById('calendar-container');
        const modal = document.getElementById('event-modal');
        const overlay = document.getElementById('overlay');
        const noteInput = document.getElementById('event-note');
        const colorPicker = document.getElementById('color-picker');
        const loadingIndicator = document.getElementById('loading-indicator');
        const userInfo = document.getElementById('user-info');
        const btnLogin = document.getElementById('btn-login');
        const btnFilterMe = document.getElementById('btn-filter-me');
        const btnShare = document.getElementById('btn-share');
        const recentList = document.getElementById('recent-list');
        
        // Add a manual sync button to header dynamically
        const syncBtn = document.createElement('button');
        syncBtn.id = 'btn-sync';
        syncBtn.className = 'tool-btn';
        syncBtn.textContent = 'RE-SYNC DATA';
        syncBtn.onclick = () => { console.log("MANUAL SYNC TRIGGERED"); startListening(); };
        document.querySelector('.controls').appendChild(syncBtn);

        // --- Sidebar & Persistence ---
        function getRecentCalendars() {
            try { return JSON.parse(localStorage.getItem('recent_cids') || '[]'); } catch (e) { return []; }
        }

        function saveRecentCalendar(cid) {
            let recents = getRecentCalendars();
            if (!recents.includes(cid)) {
                recents.unshift(cid);
                recents = recents.slice(0, 15);
                localStorage.setItem('recent_cids', JSON.stringify(recents));
            }
            renderSidebar();
        }

        function removeRecentCalendar(cid) {
            let recents = getRecentCalendars().filter(id => id !== cid);
            localStorage.setItem('recent_cids', JSON.stringify(recents));
            renderSidebar();
        }

        function renderSidebar() {
            const recents = getRecentCalendars();
            recentList.innerHTML = '';
            recents.forEach(cid => {
                const item = document.createElement('div');
                item.className = 'recent-item' + (cid === currentCid ? ' active' : '');
                item.textContent = cid;
                item.onclick = () => {
                    const action = prompt(`Calendar: ${cid}\nType "open" or "delete":`, 'open');
                    if (action === 'open') {
                        window.location.href = window.location.pathname + '?cid=' + cid;
                    } else if (action === 'delete') {
                        removeRecentCalendar(cid);
                    }
                };
                recentList.appendChild(item);
            });
        }

        saveRecentCalendar(currentCid);

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        const presetColors = ['#ff5555', '#50fa7b', '#8be9fd', '#bd93f9', '#ff79c6', '#f1fa8c', '#ffb86c', '#ff6e6e', '#ffffff'];
        
        let isDragging = false;
        let selectionPool = new Set();
        let selectedColor = presetColors[0];
        let currentUser = null;
        let filterMyEvents = false;
        let allEvents = [];
        let modalActive = false;

        presetColors.forEach(c => {
            const div = document.createElement('div');
            div.className = 'color-opt';
            div.style.backgroundColor = c;
            if (c === selectedColor) div.classList.add('active');
            div.onclick = () => {
                document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('active'));
                div.classList.add('active');
                selectedColor = c;
            };
            colorPicker.appendChild(div);
        });

        function initCalendarUI() {
            container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const monthCont = document.createElement('div');
                monthCont.className = 'month-container';
                const grid = document.createElement('div');
                grid.className = 'month-grid';
                const name = document.createElement('div');
                name.className = 'month-name';
                name.textContent = months[m];
                grid.appendChild(name);

                weekdays.forEach(wd => {
                    const h = document.createElement('div');
                    h.className = 'weekday-header'; h.textContent = wd;
                    grid.appendChild(h);
                });

                const firstDay = new Date(2026, m, 1).getDay();
                const totalDays = new Date(2026, m + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'day empty'; grid.appendChild(empty);
                }

                for (let d = 1; d <= totalDays; d++) {
                    const day = document.createElement('div');
                    day.className = 'day';
                    day.id = `day-${m}-${d}`;
                    day.textContent = d;
                    day.dataset.m = m; day.dataset.d = d;
                    const stripes = document.createElement('div');
                    stripes.className = 'stripe-container';
                    day.appendChild(stripes);

                    day.addEventListener('mousedown', (e) => {
                        if (isDragging || modalActive) return;
                        isDragging = true;
                        if (!e.shiftKey) clearSelectionPool();
                        addToSelection(day);
                    });
                    day.addEventListener('mouseenter', () => { if (isDragging) addToSelection(day); });
                    grid.appendChild(day);
                }

                const legend = document.createElement('div');
                legend.className = 'legend-panel';
                legend.id = `legend-${m}`;

                monthCont.appendChild(grid);
                monthCont.appendChild(legend);
                container.appendChild(monthCont);
            }
            console.log("Calendar UI Initialized");
        }

        function addToSelection(day) { day.classList.add('selected'); selectionPool.add(day); }
        function clearSelectionPool() { selectionPool.forEach(el => el.classList.remove('selected')); selectionPool.clear(); }

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (selectionPool.size > 0 && !e.shiftKey) showModal();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift' && selectionPool.size > 0 && !isDragging) showModal();
        });

        function showModal() {
            if (modalActive) return;
            if (!currentUser && auth) {
                alert("Please sign in with Google to add entries.");
                clearSelectionPool();
                return;
            }
            modalActive = true;
            modal.style.display = 'block';
            overlay.style.display = 'block';
            noteInput.focus();
        }

        function hideModal() {
            noteInput.blur();
            modal.style.display = 'none';
            overlay.style.display = 'none';
            noteInput.value = "";
            clearSelectionPool();
            setTimeout(() => { modalActive = false; }, 100);
        }

        btnLogin.onclick = async () => {
            if (!auth) return;
            if (currentUser) {
                await signOut(auth);
            } else {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (err) {
                    console.error("Auth error", err);
                }
            }
        };

        document.getElementById('btn-save').onclick = async (e) => {
            if (e) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
            const note = noteInput.value.trim();
            if (!note) { alert("Please enter a description."); return; }
            if (selectionPool.size === 0) { alert("No days selected."); hideModal(); return; }

            const initials = getInitials(currentUser ? currentUser.displayName : "Guest User");
            const days = Array.from(selectionPool).map(d => ({
                m: parseInt(d.dataset.m),
                d: parseInt(d.dataset.d)
            }));
            
            const eventData = {
                note: note,
                initials: initials,
                color: selectedColor,
                days: days,
                timestamp: Date.now(),
                userId: currentUser ? currentUser.uid : 'local',
                userName: currentUser ? (currentUser.displayName || currentUser.email) : 'Guest'
            };

            console.log("SAVE ATTEMPT - CID:", currentCid, "Data:", JSON.stringify(eventData));
            hideModal();

            try {
                if (db && currentUser) {
                    loadingIndicator.textContent = "Saving to cloud...";
                    const colRef = collection(db, 'artifacts', currentCid, 'public', 'data', 'events');
                    console.log("Collection path:", colRef.path);
                    const docRef = await addDoc(colRef, eventData);
                    console.log("SAVE SUCCESS - Doc ID:", docRef.id);
                    loadingIndicator.textContent = "Cloud Active";
                } else {
                    console.warn("LOCAL SAVE - No DB or User", {db: !!db, user: !!currentUser});
                    allEvents.push(eventData);
                    renderEvents();
                }
            } catch (err) { 
                console.error("FIREBASE SAVE ERROR:", err);
                loadingIndicator.textContent = "Save Error";
                alert("Cloud Save Error: " + err.message + "\n(Check Firestore Security Rules)");
            }
        };

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                console.log("Auth Changed:", user ? user.email : "Logged Out");
                currentUser = user;
                if (user) {
                    userInfo.textContent = `Signed in as: ${user.displayName || user.email}`;
                    btnLogin.textContent = "SIGN OUT";
                    loadingIndicator.textContent = "Cloud Active";
                    startListening();
                } else {
                    userInfo.textContent = "Not signed in";
                    btnLogin.textContent = "SIGN IN WITH GOOGLE";
                    loadingIndicator.textContent = "Read Only Mode";
                    allEvents = [];
                    renderEvents();
                    startListening();
                }
            });
        }

        function renderEvents() {
            console.log("Rendering", allEvents.length, "events");
            document.querySelectorAll('.stripe-container').forEach(c => c.innerHTML = '');
            document.querySelectorAll('.legend-panel').forEach(l => l.innerHTML = '');

            const visibleEvents = (filterMyEvents && currentUser)
                ? allEvents.filter(e => e.userId === currentUser.uid) 
                : allEvents;

            visibleEvents.forEach(data => {
                const { days, color, note, initials, _pending } = data;
                days.forEach(dayInfo => {
                    const dayEl = document.getElementById(`day-${dayInfo.m}-${dayInfo.d}`);
                    if (dayEl) {
                        const stripe = document.createElement('div');
                        stripe.className = 'event-stripe';
                        stripe.style.backgroundColor = color;
                        dayEl.querySelector('.stripe-container').appendChild(stripe);
                    }
                });

                if (days.length > 0) {
                    const sortedDays = [...days].sort((a,b) => a.m - b.m || a.d - b.d);
                    const firstMonth = sortedDays[0].m;
                    const legendPanel = document.getElementById(`legend-${firstMonth}`);
                    if (legendPanel) {
                        const item = document.createElement('div');
                        item.className = 'legend-item';
                        const syncIcon = _pending ? ' (⌛ Syncing...)' : '';
                        item.innerHTML = `<div class="legend-text"><span class="initials-tag" style="color:${color}">[${initials}]</span> <span>${note}${syncIcon}</span></div>`;
                        legendPanel.appendChild(item);
                    }
                }
            });
        }

        let unsubscribeEvents = null;
        async function startListening() {
            if (!db) {
                console.error("StartListening failed: db is null");
                return;
            }
            if (unsubscribeEvents) { 
                console.log("Cleaning up old listener");
                unsubscribeEvents(); 
                unsubscribeEvents = null; 
            }
            const colRef = collection(db, 'artifacts', currentCid, 'public', 'data', 'events');
            console.log("Initializing listener on:", colRef.path);

            // FORCE SERVER FETCH to see what's actually persisted
            try {
                const querySnapshot = await getDocsFromServer(colRef);
                console.log("SERVER-SIDE VERIFICATION: found", querySnapshot.size, "actual documents on Google servers.");
            } catch (e) {
                console.error("SERVER-SIDE FETCH FAILED (Check Permissions/Network):", e);
            }

            unsubscribeEvents = onSnapshot(colRef, (snapshot) => {
                console.log("SNAPSHOT UPDATE: received", snapshot.docs.length, "docs. PendingWrites:", snapshot.metadata.hasPendingWrites, "FromCache:", snapshot.metadata.fromCache);
                allEvents = snapshot.docs.map(doc => ({
                    id: doc.id, 
                    _pending: doc.metadata.hasPendingWrites,
                    ...doc.data()
                }));
                renderEvents();
            }, (err) => { 
                console.error("FIRESTORE LISTENER ERROR:", err);
                loadingIndicator.textContent = "Sync Error"; 
            });
        }

        document.getElementById('btn-cancel').onclick = (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();
            hideModal();
        };
        
        btnFilterMe.onclick = () => { filterMyEvents = !filterMyEvents; btnFilterMe.classList.toggle('active', filterMyEvents); renderEvents(); };
        btnShare.onclick = () => { 
            const dummy = document.createElement('input'); 
            document.body.appendChild(dummy); 
            dummy.value = window.location.href; 
            dummy.select(); 
            document.execCommand('copy'); 
            document.body.removeChild(dummy);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        };

        initCalendarUI();
    </script>
</body>
</html>
