<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar 2026</title>
    <!-- Use the same logic and styling as your current calendar_2026.html -->
    <style>
        :root {
            --bg-primary: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
            --selection-bg: rgba(255, 255, 255, 0.3);
            --font-mono: 'DejaVu Sans Mono', 'Courier New', Courier, monospace;
            --accent: #bd93f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-mono);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            overflow-x: auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button.tool-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.tool-btn:hover {
            background: #333;
            border-color: #666;
        }

        button.tool-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .instructions {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        kbd {
            background: #333;
            padding: 2px 4px;
            border-radius: 3px;
            color: #fff;
        }

        #calendar-container {
            display: grid;
            grid-template-columns: repeat(3, 400px); 
            gap: 40px 20px;
            justify-content: center;
            width: fit-content;
        }

        .month-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            min-height: 220px;
            width: 400px;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 32px);
            grid-auto-rows: 24px;
            user-select: none;
            flex-shrink: 0;
        }

        .month-name {
            grid-column: span 7;
            text-align: center;
            font-weight: bold;
            height: 30px;
            line-height: 30px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 5px;
        }

        .weekday-header {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            line-height: 24px;
        }

        .day {
            position: relative;
            text-align: center;
            line-height: 24px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .day:hover {
            border-color: #555;
        }

        .day.selected {
            background-color: var(--selection-bg);
        }

        .day.empty {
            cursor: default;
        }

        .stripe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column-reverse; 
            pointer-events: none;
            padding-bottom: 2px;
        }

        .event-stripe {
            width: 100%;
            height: 1px;
            margin-top: 1px;
        }

        .legend-panel {
            flex: 1;
            font-size: 0.65rem;
            border-left: 1px solid var(--border-color);
            padding-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: 180px;
            margin-top: 35px;
            max-width: 150px;
        }

        .legend-item {
            display: flex;
            align-items: flex-start;
            gap: 5px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .legend-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .initials-tag {
            color: var(--text-muted);
            font-weight: bold;
            margin-right: 2px;
        }

        .color-dot {
            width: 10px;
            height: 2px;
            display: inline-block;
            flex-shrink: 0;
            margin-top: 6px;
        }

        #event-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 1px solid #444;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 320px;
        }

        #event-modal h3 {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #ddd;
        }

        .modal-field {
            margin-bottom: 15px;
        }

        .modal-field label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        #event-modal input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            font-family: var(--font-mono);
        }

        .color-picker {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .color-opt {
            width: 20px;
            height: 20px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-opt.active {
            border-color: #fff;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btns button {
            padding: 5px 12px;
            cursor: pointer;
            background: #333;
            border: 1px solid #555;
            color: white;
            font-family: var(--font-mono);
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

        #loading-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 4px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header>
        <h1>CALENDAR 2026</h1>
        <div class="controls">
            <button id="btn-share" class="tool-btn">SHARE LINK</button>
            <button id="btn-filter-me" class="tool-btn">MY ENTRIES ONLY</button>
        </div>
        <p class="instructions">Drag to select. Hold <kbd>Shift</kbd> to add ranges. Release <kbd>Shift</kbd> to tag.</p>
    </header>

    <div id="calendar-container"></div>
    <div id="loading-indicator">Initializing...</div>
    <div id="toast" class="toast">Link copied to clipboard!</div>

    <div id="overlay"></div>
    <div id="event-modal">
        <h3>New Entry</h3>
        <div class="modal-field">
            <label>Initials</label>
            <input type="text" id="event-initials" maxlength="3" placeholder="ABC" style="width: 60px">
        </div>
        <div class="modal-field">
            <label>Description</label>
            <input type="text" id="event-note" placeholder="Meeting, Holiday, etc." autocomplete="off">
        </div>
        <div class="modal-field">
            <label>Category Color</label>
            <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="modal-btns">
            <button id="btn-cancel">Cancel</button>
            <button id="btn-save">Save</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables will be injected by the hosting provider or remain as defaults
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const container = document.getElementById('calendar-container');
        const modal = document.getElementById('event-modal');
        const overlay = document.getElementById('overlay');
        const noteInput = document.getElementById('event-note');
        const initialsInput = document.getElementById('event-initials');
        const colorPicker = document.getElementById('color-picker');
        const loadingIndicator = document.getElementById('loading-indicator');
        const toast = document.getElementById('toast');
        const btnFilterMe = document.getElementById('btn-filter-me');
        const btnShare = document.getElementById('btn-share');
        
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        const presetColors = ['#ff5555', '#50fa7b', '#8be9fd', '#bd93f9', '#ff79c6', '#f1fa8c', '#ffb86c', '#ff6e6e', '#ffffff'];
        
        let isDragging = false;
        let selectionPool = new Set();
        let selectedColor = presetColors[0];
        let currentUser = null;
        let filterMyEvents = false;
        let allEvents = [];

        // UI Prep
        presetColors.forEach(c => {
            const div = document.createElement('div');
            div.className = 'color-opt';
            div.style.backgroundColor = c;
            if (c === selectedColor) div.classList.add('active');
            div.onclick = () => {
                document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('active'));
                div.classList.add('active');
                selectedColor = c;
            };
            colorPicker.appendChild(div);
        });

        initialsInput.value = localStorage.getItem('cal_initials') || '';

        function initCalendarUI() {
            container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const monthCont = document.createElement('div');
                monthCont.className = 'month-container';
                const grid = document.createElement('div');
                grid.className = 'month-grid';
                const name = document.createElement('div');
                name.className = 'month-name';
                name.textContent = months[m];
                grid.appendChild(name);

                weekdays.forEach(wd => {
                    const h = document.createElement('div');
                    h.className = 'weekday-header';
                    h.textContent = wd;
                    grid.appendChild(h);
                });

                const firstDay = new Date(2026, m, 1).getDay();
                const totalDays = new Date(2026, m + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'day empty';
                    grid.appendChild(empty);
                }

                for (let d = 1; d <= totalDays; d++) {
                    const day = document.createElement('div');
                    day.className = 'day';
                    day.id = `day-${m}-${d}`;
                    day.textContent = d;
                    day.dataset.m = m;
                    day.dataset.d = d;
                    const stripes = document.createElement('div');
                    stripes.className = 'stripe-container';
                    day.appendChild(stripes);

                    day.addEventListener('mousedown', (e) => {
                        if (isDragging) return;
                        isDragging = true;
                        if (!e.shiftKey) clearSelectionPool();
                        addToSelection(day);
                    });
                    day.addEventListener('mouseenter', () => {
                        if (isDragging) addToSelection(day);
                    });
                    grid.appendChild(day);
                }

                const legend = document.createElement('div');
                legend.className = 'legend-panel';
                legend.id = `legend-${m}`;

                monthCont.appendChild(grid);
                monthCont.appendChild(legend);
                container.appendChild(monthCont);
            }
        }

        function addToSelection(day) {
            day.classList.add('selected');
            selectionPool.add(day);
        }

        function clearSelectionPool() {
            selectionPool.forEach(el => el.classList.remove('selected'));
            selectionPool.clear();
        }

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (selectionPool.size > 0 && !e.shiftKey) showModal();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift' && selectionPool.size > 0 && !isDragging) showModal();
        });

        function showModal() {
            modal.style.display = 'block';
            overlay.style.display = 'block';
            noteInput.focus();
        }

        function hideModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
            noteInput.value = "";
            clearSelectionPool();
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        btnShare.onclick = () => {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("Share link copied!");
        };

        btnFilterMe.onclick = () => {
            filterMyEvents = !filterMyEvents;
            btnFilterMe.classList.toggle('active', filterMyEvents);
            renderEvents();
        };

        document.getElementById('btn-cancel').onclick = hideModal;

        document.getElementById('btn-save').onclick = async () => {
            const note = noteInput.value.trim();
            const initials = initialsInput.value.trim().toUpperCase() || '??';
            if (note && currentUser) {
                localStorage.setItem('cal_initials', initials);
                const days = Array.from(selectionPool).map(d => ({
                    m: parseInt(d.dataset.m),
                    d: parseInt(d.dataset.d)
                }));
                
                try {
                    loadingIndicator.textContent = "Syncing...";
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'events'), {
                        note,
                        initials,
                        color: selectedColor,
                        days,
                        timestamp: Date.now(),
                        userId: currentUser.uid
                    });
                } catch (err) {
                    console.error("Save error:", err);
                }
            }
            hideModal();
        };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadingIndicator.textContent = "Live Connected";
                startListening();
            }
        });

        function renderEvents() {
            document.querySelectorAll('.stripe-container').forEach(c => c.innerHTML = '');
            document.querySelectorAll('.legend-panel').forEach(l => l.innerHTML = '');

            const visibleEvents = filterMyEvents 
                ? allEvents.filter(e => e.userId === currentUser.uid) 
                : allEvents;

            visibleEvents.forEach(data => {
                const { days, color, note, initials } = data;
                days.forEach(dayInfo => {
                    const dayEl = document.getElementById(`day-${dayInfo.m}-${dayInfo.d}`);
                    if (dayEl) {
                        const stripe = document.createElement('div');
                        stripe.className = 'event-stripe';
                        stripe.style.backgroundColor = color;
                        dayEl.querySelector('.stripe-container').appendChild(stripe);
                    }
                });

                if (days.length > 0) {
                    const sortedDays = [...days].sort((a,b) => a.m - b.m || a.d - b.d);
                    const firstMonth = sortedDays[0].m;
                    const legendPanel = document.getElementById(`legend-${firstMonth}`);
                    if (legendPanel) {
                        const item = document.createElement('div');
                        item.className = 'legend-item';
                        item.innerHTML = `
                            <span class="color-dot" style="background:${color}"></span> 
                            <div class="legend-text">
                                <span class="initials-tag">[${initials}]</span> <span>${note}</span>
                            </div>
                        `;
                        legendPanel.appendChild(item);
                    }
                }
            });
        }

        function startListening() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'events');
            onSnapshot(q, (snapshot) => {
                allEvents = snapshot.docs.map(doc => doc.data());
                renderEvents();
            }, (err) => {
                loadingIndicator.textContent = "Sync Error";
            });
        }

        initCalendarUI();
        initAuth();
    </script>
</body>
</html>
